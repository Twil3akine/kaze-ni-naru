<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>風になる | KAZE NI NARU</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #aee2ff;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px;
    display: flex; gap: 14px; align-items: flex-start; pointer-events: none; z-index: 5; }
  .meter { background: rgba(255,255,255,.82); border-radius: 12px; padding: 8px 12px;
    box-shadow: 0 2px 10px rgba(30,60,90,.15); min-width: 150px; }
  .meter .label { font-size: 11px; font-weight: 700; color: #35618a; letter-spacing: .08em; }
  .meter .bar { height: 10px; border-radius: 5px; background: #dcebf5; margin-top: 5px; overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 5px; transition: width .15s linear; }
  #dryFill { background: linear-gradient(90deg, #ffb347, #ff8c42); width: 0%; }
  #pinFill { background: #57b25e; width: 100%; }
  #windFill { background: linear-gradient(90deg, #7ec8f7, #2f7fd0); width: 0%; }
  .meter .value { font-size: 12px; color: #274b63; margin-top: 3px; font-variant-numeric: tabular-nums; }
  #timerBox { margin-left: auto; text-align: right; }
  #timer { font-size: 22px; font-weight: 800; color: #274b63; font-variant-numeric: tabular-nums; }
  #windDir { font-size: 20px; }

  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; z-index: 10;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.25), rgba(120,180,230,.45));
    padding: 20px; }
  .overlay.hidden { display: none; }
  .title { font-size: clamp(38px, 9vw, 74px); font-weight: 900; color: #fff;
    text-shadow: 0 3px 0 #5ea9dd, 0 8px 24px rgba(30,80,130,.35); letter-spacing: .06em; }
  .subtitle { margin-top: 6px; font-size: clamp(13px, 3vw, 17px); color: #20506e; font-weight: 700; }
  .howto { margin-top: 18px; background: rgba(255,255,255,.88); border-radius: 14px;
    padding: 14px 18px; font-size: 14px; line-height: 1.9; color: #274b63;
    box-shadow: 0 4px 18px rgba(30,60,90,.18); max-width: 430px; }
  .btn { margin-top: 22px; pointer-events: auto; cursor: pointer; border: none;
    background: #ff8c42; color: #fff; font-size: 19px; font-weight: 900;
    padding: 13px 38px; border-radius: 999px; letter-spacing: .1em;
    box-shadow: 0 5px 0 #d96f27, 0 10px 22px rgba(200,110,40,.35); transition: transform .06s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #d96f27; }
  #bigMsg { font-size: clamp(30px, 7vw, 54px); font-weight: 900; color: #fff;
    text-shadow: 0 3px 0 rgba(60,110,160,.55), 0 8px 24px rgba(30,80,130,.35); }
  #subMsg { margin-top: 10px; font-size: 16px; font-weight: 700; color: #20506e;
    background: rgba(255,255,255,.85); padding: 8px 16px; border-radius: 999px; }
  #hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: rgba(32,80,110,.75); font-weight: 700; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<div id="scene"></div>

<div id="hud">
  <div class="meter">
    <div class="label">かわき具合</div>
    <div class="bar"><div class="fill" id="dryFill"></div></div>
    <div class="value" id="dryVal">0%</div>
  </div>
  <div class="meter">
    <div class="label">洗濯バサミ</div>
    <div class="bar"><div class="fill" id="pinFill"></div></div>
    <div class="value" id="pinVal">2個 とも元気</div>
  </div>
  <div class="meter">
    <div class="label">風のつよさ</div>
    <div class="bar"><div class="fill" id="windFill"></div></div>
    <div class="value"><span id="windDir">→</span> <span id="windVal">0.0</span></div>
  </div>
  <div id="timerBox"><div id="timer">0:00</div></div>
</div>

<div id="hint">ドラッグで風を起こす。強い風は速く乾くけど、バサミがちぎれる。</div>

<div class="overlay" id="startScreen">
  <div class="title">風になる</div>
  <div class="subtitle">あなたは風です。シャツを乾かしてください。</div>
  <div class="howto">
    ドラッグすると、その向きに風が吹きます。<br>
    風が強いほどシャツは速く乾きますが、<br>
    強すぎると洗濯バサミがちぎれて飛んでいきます。<br>
    乾ききったら勝ち。飛んだら負け。
  </div>
  <button class="btn" id="startBtn">風になる</button>
  <div id="loadStatus" style="margin-top:14px;font-size:12px;color:#20506e;font-weight:700;max-width:90vw;word-break:break-all;">読み込み中…</div>
</div>

<div class="overlay hidden" id="endScreen">
  <div id="bigMsg"></div>
  <div id="subMsg"></div>
  <button class="btn" id="retryBtn">もう一度 干す</button>
</div>

// シャツの輪郭 (u: 左→右 0..1, v: 上→下 0..1)。テクスチャ描画と三角形の切り落としで共有する
function shirtTopV(u) {
  return 0.015 + 0.05 * Math.abs(2 * u - 1) + 0.05 * Math.exp(-(((u - 0.5) / 0.09) ** 2));
}
function shirtPolygon() {
  const pts = [];
  for (let u = 0; u <= 1.0001; u += 0.02) pts.push([u, shirtTopV(u)]);
  pts.push([1, 0.30], [0.82, 0.235], [0.82, 0.95]);
  for (let u = 0.82; u >= 0.1799; u -= 0.04) pts.push([u, 0.95 + 0.025 * Math.sin(Math.PI * (u - 0.18) / 0.64)]);
  pts.push([0.18, 0.95], [0.18, 0.235], [0, 0.30]);
  return pts;
}
const SHIRT_POLY = shirtPolygon();
function pointInShirt(u, v) {
  let inside = false;
  for (let i = 0, j = SHIRT_POLY.length - 1; i < SHIRT_POLY.length; j = i++) {
    const [xi, yi] = SHIRT_POLY[i], [xj, yj] = SHIRT_POLY[j];
    if ((yi > v) !== (yj > v) && u < (xj - xi) * (v - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

  // ポケット風ワンポイントとプリント
  g.fillStyle = '#ffb340'; g.strokeStyle = '#e08b3a'; g.lineWidth = 4;
  g.beginPath(); g.arc(...P(0.615, 0.40), 30, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = 'rgba(53,97,138,0.85)'; g.font = 'bold 58px sans-serif'; g.textAlign = 'center';
  g.fillText('KAZE', 0.5 * W, 0.60 * H);
  g.restore();
  g.strokeStyle = 'rgba(155,170,180,0.9)'; g.lineWidth = 3; g.stroke(path);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
const clothGeo = new THREE.PlaneGeometry(1, 1, COLS - 1, ROWS - 1);
{ // 輪郭の外の三角形を落として Tシャツの形にする (3頂点すべて内側のものだけ残す: 際の食み出し・橋渡し防止)
  const uvA = clothGeo.getAttribute('uv');
  const idx = clothGeo.getIndex().array;
  const kept = [];
  for (let t = 0; t < idx.length; t += 3) {
    let ok = true;
    for (let k = 0; k < 3; k++) {
      if (!pointInShirt(uvA.getX(idx[t + k]), 1 - uvA.getY(idx[t + k]))) { ok = false; break; }
    }
    if (ok) kept.push(idx[t], idx[t + 1], idx[t + 2]);
  }
  clothGeo.setIndex(kept);
}
const colors = new Float32Array(N * 3);
clothGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const clothMat = new THREE.MeshStandardMaterial({
  map: makeShirtTexture(), side: THREE.DoubleSide, roughness: 0.85,
  vertexColors: true, alphaTest: 0.5,
});
const cloth = new THREE.Mesh(clothGeo, clothMat);
cloth.castShadow = true; cloth.frustumCulled = false;
scene.add(cloth);

// 風の粒子
const PNUM = 260;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PNUM * 3);
const pSeed = [];
for (let i = 0; i < PNUM; i++) {
  pPos[i * 3] = (Math.random() - 0.5) * 10;
  pPos[i * 3 + 1] = Math.random() * 3.6 + 0.3;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 6;
  pSeed.push(0.5 + Math.random());
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.055, transparent: true, opacity: 0.65 });
const windPts = new THREE.Points(pGeo, pMat);
windPts.frustumCulled = false;
scene.add(windPts);

// ---------- 風の入力 ----------
let wind = { x: 0, y: 0, z: 0 };
let windTarget = { x: 0, y: 0, z: 0 };
let dragging = false, lastPX = 0, lastPY = 0, lastPT = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  dragging = true; lastPX = e.clientX; lastPY = e.clientY; lastPT = performance.now();
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now();
  const dt = Math.max((now - lastPT) / 1000, 0.008);
  const vx = (e.clientX - lastPX) / dt;   // px/s
  const vy = (e.clientY - lastPY) / dt;
  lastPX = e.clientX; lastPY = e.clientY; lastPT = now;
  // 横ドラッグ -> x 風, 縦ドラッグ -> z 風 (手前/奥) + 少し浮力
  // 速度そのものを風の目標にする (蓄積すると持続ドラッグで必ず最大まで張り付くため)
  windTarget.x = THREE.MathUtils.clamp(vx * 0.014, -16, 16);
  windTarget.z = THREE.MathUtils.clamp(vy * 0.013, -14, 14);
  windTarget.y = THREE.MathUtils.clamp(Math.abs(vx) * 0.0016, 0, 2.5);
});
addEventListener('pointerup', () => { dragging = false; });

// ---------- ゲーム状態 ----------
let playing = false, startAt = 0, elapsed = 0, ended = false;
const $ = id => document.getElementById(id);
$('startBtn').addEventListener('click', () => {
  $('startScreen').classList.add('hidden');
  wasm.sim_init(); playing = true; ended = false;
  startAt = performance.now(); elapsed = 0;
});
$('retryBtn').addEventListener('click', () => {
  $('endScreen').classList.add('hidden');
  wasm.sim_init(); playing = true; ended = false;
  startAt = performance.now(); elapsed = 0;
  wind = { x: 0, y: 0, z: 0 }; windTarget = { x: 0, y: 0, z: 0 };
});

const arrows = ['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'];
function fmtTime(s) {
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return `${m}:${String(ss).padStart(2, '0')}`;
}

let simAcc = 0;
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 風: 目標へ寄せつつ、自然なそよ風へ減衰
  const breeze = Math.sin(t * 0.6) * 0.7 + Math.sin(t * 1.7) * 0.3;
  windTarget.x += (breeze - windTarget.x) * dt * (dragging ? 2.2 : 1.4);
  windTarget.z += (0 - windTarget.z) * dt * (dragging ? 2.2 : 1.4);
  windTarget.y += (0 - windTarget.y) * dt * 1.2;
  const k = 1 - Math.exp(-dt * 7);
  wind.x += (windTarget.x - wind.x) * k;
  wind.y += (windTarget.y - wind.y) * k;
  wind.z += (windTarget.z - wind.z) * k;

  // 物理は固定刻み 1/60 で回す (フレームレートで挙動が変わらないように)
  if (playing) {
    simAcc = Math.min(simAcc + dt, 4 / 60);
    while (simAcc >= 1 / 60) { wasm.sim_step(1 / 60, wind.x, wind.y, wind.z); simAcc -= 1 / 60; }
  }

  // 布の頂点を更新
  const mem = new Float32Array(wasm.memory.buffer);
  const posPtr = wasm.sim_positions_ptr() / 4;
  const wetPtr = wasm.sim_wet_ptr() / 4;
  const pa = clothGeo.attributes.position.array;
  for (let i = 0; i < N; i++) {
    pa[i * 3] = mem[posPtr + i * 3];
    pa[i * 3 + 1] = mem[posPtr + i * 3 + 1];
    pa[i * 3 + 2] = mem[posPtr + i * 3 + 2];
    const wet = mem[wetPtr + i];
    // 濡れ: 暗く青く / 乾き: そのまま
    const r = 1.0 - wet * 0.45, g = 1.0 - wet * 0.42, b = 1.0 - wet * 0.25;
    colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
  }
  clothGeo.attributes.position.needsUpdate = true;
  clothGeo.attributes.color.needsUpdate = true;
  clothGeo.computeVertexNormals();

  // バサミ表示
  for (let kk = 0; kk < 2; kk++) {
    pins[kk].visible = wasm.sim_pin_alive(kk) === 1;
  }

  // 風粒子
  const ws = Math.hypot(wind.x, wind.z);
  for (let i = 0; i < PNUM; i++) {
    pPos[i * 3] += (wind.x * 0.55 + breeze * 0.3) * pSeed[i] * dt;
    pPos[i * 3 + 1] += (Math.sin(t * 2 + i) * 0.12 + wind.y * 0.15) * dt;
    pPos[i * 3 + 2] += wind.z * 0.55 * pSeed[i] * dt;
    if (pPos[i * 3] > 6 || pPos[i * 3] < -6 || pPos[i * 3 + 2] > 4 || pPos[i * 3 + 2] < -4 || pPos[i * 3 + 1] < 0.1) {
      pPos[i * 3] = -Math.sign(wind.x || 1) * 5.5 + (Math.random() - 0.5);
      pPos[i * 3 + 1] = Math.random() * 3.4 + 0.3;
      pPos[i * 3 + 2] = (Math.random() - 0.5) * 5;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
  pMat.opacity = THREE.MathUtils.clamp(0.15 + ws * 0.045, 0.15, 0.8);

  // 雲は風で流れる
  for (const cl of clouds) {
    cl.position.x += (0.12 + wind.x * 0.05) * dt;
    if (cl.position.x > 18) cl.position.x = -18;
  }

  // HUD
  const avgWet = wasm.sim_avg_wet();
  const dryPct = Math.round((1 - avgWet) * 100);
  $('dryFill').style.width = dryPct + '%';
  $('dryVal').textContent = dryPct + '%';
  const pinsLeft = wasm.sim_pins();
  const ph = wasm.sim_pin_health();
  $('pinFill').style.width = (pinsLeft === 0 ? 0 : ph * 100) + '%';
  $('pinFill').style.background = ph < 0.35 ? '#e05252' : (ph < 0.7 ? '#e0a92e' : '#57b25e');
  $('pinVal').textContent = pinsLeft === 2 ? '2個 とも元気' : (pinsLeft === 1 ? 'あと1個！' : '飛んだ…');
  $('windFill').style.width = Math.min(ws / 16 * 100, 100) + '%';
  $('windVal').textContent = ws.toFixed(1);
  if (ws > 0.5) {
    const ang = Math.atan2(wind.z, wind.x);
    $('windDir').textContent = arrows[Math.round(((ang + Math.PI) / (Math.PI / 4))) % 8] || '→';
  }
  if (playing && !ended) {
    elapsed = (performance.now() - startAt) / 1000;
    $('timer').textContent = fmtTime(elapsed);
  }

  // 終了判定
  const st = wasm.sim_state();
  if (playing && !ended && st !== 0) {
    ended = true; playing = false;
    if (st === 2) {
      $('bigMsg').textContent = '乾いた！';
      $('subMsg').textContent = `タイム ${fmtTime(elapsed)} — ふかふかのシャツです`;
    } else {
      $('bigMsg').textContent = '飛んでいった…';
      $('subMsg').textContent = '風が強すぎました。シャツはあの空の向こうです';
    }
    $('endScreen').classList.remove('hidden');
  }

  camera.position.x = 0.4 + Math.sin(t * 0.25) * 0.15;
  camera.lookAt(0, 1.85, 0);
  renderer.render(scene, camera);
}
setStatus('準備完了');
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
